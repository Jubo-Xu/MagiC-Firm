<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">RootOutputSync — root output path (RootOutputSync.sv)</tspan><tspan x="38.0" y="49.2">wraps OutputSync and stamps every emitted det-time word with stim global detector indices and round markers for the host / decoder</tspan></text>
<rect x="220" y="70" width="1080" height="720" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="228.0" y="86.3" font-weight="bold">RootOutputSync  #(D, D_FIFO, PC_W, INDEX_W, HW_WIDTH, STRIDE, SENTINEL, SAT_PC)</tspan></text>
<rect x="20" y="130" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="145.3">in_det / in_valid / in_finish [D]</tspan><tspan x="110.0" y="156.6">(= d_out bus: pass ++ construct)</tspan></text>
<rect x="20" y="300" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="314.9">sync_mask [D]  @ pc</tspan></text>
<rect x="20" y="400" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="414.9">global_indexes [D × INDEX_W]  @ pc</tspan></text>
<rect x="20" y="470" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="485.3">round_marker [3]  @ pc</tspan><tspan x="110.0" y="496.6">{is_first_normal, is_last_normal, is_wait}</tspan></text>
<rect x="260" y="110" width="300" height="90" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="410.0" y="144.8" font-weight="bold">OutputSync  (see 05)</tspan><tspan x="410.0" y="158.6">per-line FIFOs · ready · pc</tspan><tspan x="410.0" y="172.3">→ out_det, out_used, out_valid, out_finish</tspan></text>
<rect x="620" y="230" width="300" height="110" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="770.0" y="263.2">round markers (aligned with out_det)</tspan><tspan x="770.0" y="275.8">first_normal = valid &amp; rm_reg[0]</tspan><tspan x="770.0" y="288.2">last_normal  = valid &amp; rm_reg[1]</tspan><tspan x="770.0" y="300.8">first_wait   = valid &amp; rm_reg[2] &amp; ~is_wait_q</tspan><tspan x="770.0" y="313.2">last_wait    = valid &amp; rm_reg[2] &amp; finish</tspan></text>
<rect x="260" y="380" width="300" height="100" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="410.0" y="408.2">1-cycle alignment registers</tspan><tspan x="410.0" y="420.8">gi_reg ← global_indexes</tspan><tspan x="410.0" y="433.2">rm_reg ← round_marker</tspan><tspan x="410.0" y="445.8">pc_reg ← sync_regfile_pc</tspan><tspan x="410.0" y="458.2">(line up with OutputSync's registered out_det)</tspan></text>
<rect x="620" y="380" width="300" height="150" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="770.0" y="420.8">per line l:</tspan><tspan x="770.0" y="433.2">idx = gi_reg[l]</tspan><tspan x="770.0" y="445.8">used = out_valid &amp; out_used[l]</tspan><tspan x="770.0" y="458.2">out_global_indexes[l] =</tspan><tspan x="770.0" y="470.8">  (used &amp;&amp; idx != SENTINEL)</tspan><tspan x="770.0" y="483.2">    ? zext(idx) + offset</tspan><tspan x="770.0" y="495.8">    : all-ones  (HW_WIDTH)</tspan></text>
<rect x="260" y="520" width="300" height="90" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="410.0" y="549.5">wait counter w</tspan><tspan x="410.0" y="562.0">sat_here = SAT_EN &amp; (pc_reg == SAT_PC)</tspan><tspan x="410.0" y="574.5">if out_valid &amp; sat_here: w ← w + 1</tspan><tspan x="410.0" y="587.0">is_wait_q ← rm_reg[2] on each valid</tspan></text>
<rect x="620" y="570" width="300" height="70" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="770.0" y="595.8">offset = sat_here ? w × STRIDE : 0</tspan><tspan x="770.0" y="608.2">(each repeated copy-last wait round</tspan><tspan x="770.0" y="620.8">gets a fresh detector-number block)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="268.0" y="703.5">The host / decoder consumes (out_det, out_global_indexes) per det-time; first_normal / last_normal / first_wait /</tspan><tspan x="268.0" y="716.0">last_wait tell the control core where the normal rounds end and the (repeated) wait rounds begin and end.</tspan></text>
<rect x="1330" y="120" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1420.0" y="135.3">out_det / out_used [D]</tspan><tspan x="1420.0" y="146.6">out_valid / out_finish</tspan></text>
<rect x="1330" y="190" width="180" height="48" rx="24.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1420.0" y="205.7">sync_regfile_pc</tspan><tspan x="1420.0" y="216.9">(→ output_sync, global_index,</tspan><tspan x="1420.0" y="228.2">round_marker regfiles)</tspan></text>
<rect x="1330" y="270" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1420.0" y="285.3">first_normal / last_normal</tspan><tspan x="1420.0" y="296.6">first_wait / last_wait</tspan></text>
<rect x="1330" y="440" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1420.0" y="455.3">out_global_indexes</tspan><tspan x="1420.0" y="466.6">[D × HW_WIDTH]</tspan></text>
