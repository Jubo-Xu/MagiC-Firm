<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">Small datapath / control blocks</tspan><tspan x="38.0" y="49.2">RawSelector.sv · DetectorPass.sv · Postselect.sv · DrainAggregator.sv</tspan></text>
<rect x="30" y="70" width="600" height="220" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="86.3" font-weight="bold">RawSelector  #(R, M)  — forward R of the M raw lines up the tree</tspan></text>
<rect x="50" y="120" width="150" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="125.0" y="135.3">in_meas / in_valid /</tspan><tspan x="125.0" y="146.6">in_finish [M]</tspan></text>
<rect x="50" y="200" width="150" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="125.0" y="215.3">selector_indexes</tspan><tspan x="125.0" y="226.6">[R × ⌈log2 M⌉] (static)</tspan></text>
<rect x="240" y="110" width="240" height="80" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="360.0" y="134.5">R index muxes</tspan><tspan x="360.0" y="147.0">sel_meas[i]  = in_meas[idx_i]</tspan><tspan x="360.0" y="159.5">sel_valid[i] = in_valid[idx_i]</tspan><tspan x="360.0" y="172.0">sel_finish = OR_i (in_valid[idx_i] &amp; in_finish[idx_i])</tspan></text>
<rect x="240" y="220" width="240" height="40" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="360.0" y="243.2">1-cycle register</tspan></text>
<rect x="500" y="210" width="120" height="48" rx="24.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="560.0" y="231.3">out_meas / out_valid [R]</tspan><tspan x="560.0" y="242.6">out_finish (single)</tspan></text>
<rect x="670" y="70" width="600" height="220" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="678.0" y="86.3" font-weight="bold">DetectorPass  #(D)  — forward children's detectors up the tree (identity form of RawSelector)</tspan></text>
<rect x="690" y="150" width="150" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="765.0" y="165.3">in_det / in_valid /</tspan><tspan x="765.0" y="176.6">in_finish [D]</tspan></text>
<rect x="880" y="130" width="260" height="80" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1010.0" y="160.8">1-cycle register of the whole D-line bus</tspan><tspan x="1010.0" y="173.2">out_det ← in_det · out_valid ← in_valid</tspan><tspan x="1010.0" y="185.8">out_finish ← in_finish  (per line, stays aligned)</tspan></text>
<rect x="1160" y="150" width="100" height="48" rx="24.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1210.0" y="171.3">out_det / out_valid /</tspan><tspan x="1210.0" y="182.6">out_finish [D]</tspan></text>
<rect x="30" y="330" width="600" height="240" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="346.4" font-weight="bold">Postselect  #(D)  — stage-board reject: 'a postselect detector fired this det-time'</tspan></text>
<rect x="50" y="380" width="170" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="135.0" y="394.9">in_valid  (OutputSync.out_valid)</tspan></text>
<rect x="50" y="420" width="170" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="135.0" y="434.9">in_det [D]  (OutputSync.out_det)</tspan></text>
<rect x="50" y="480" width="170" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="135.0" y="495.3">postselect_mask [D]</tspan><tspan x="135.0" y="506.6">(ps regfile @ shared osync_pc)</tspan></text>
<rect x="260" y="470" width="200" height="50" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="360.0" y="492.0">mask_reg ← postselect_mask</tspan><tspan x="360.0" y="504.5">(1-cycle align, like gi_reg)</tspan></text>
<rect x="260" y="380" width="200" height="60" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="360.0" y="407.0">post_select =</tspan><tspan x="360.0" y="419.5">in_valid &amp; |(mask_reg &amp; in_det)</tspan></text>
<rect x="490" y="390" width="120" height="40" rx="20.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="550.0" y="407.3">post_select</tspan><tspan x="550.0" y="418.6">(→ BoardControl abort)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="58.0" y="538.5">No own pc: the postselect and output_sync regfiles are built row-for-row by det-time, so the</tspan><tspan x="58.0" y="551.0">shared osync_pc keeps them aligned and the copy-last saturation (zero row ⇒ no reject in wait rounds) is inherited.</tspan></text>
<rect x="670" y="330" width="600" height="240" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="678.0" y="346.4" font-weight="bold">DrainAggregator  #(N)  — join N one-cycle pulses (a leaf's P cw_gen_finish) into one 'all done' pulse</tspan></text>
<rect x="690" y="380" width="160" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="770.0" y="395.3">drain_done_in [N]</tspan><tspan x="770.0" y="406.6">(pulses, different cycles)</tspan></text>
<rect x="690" y="440" width="160" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="770.0" y="454.9">clear  (START)</tspan></text>
<rect x="880" y="380" width="220" height="50" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="990.0" y="402.0">latched ← latched | drain_done_in</tspan><tspan x="990.0" y="414.5">(cleared by clear / rst)</tspan></text>
<rect x="880" y="460" width="220" height="70" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="990.0" y="485.8">all_latched = &amp;latched</tspan><tspan x="990.0" y="498.2">all_drain_done = all_latched &amp; ~all_latched_q</tspan><tspan x="990.0" y="510.8">(edge-aligned, one full cycle wide)</tspan></text>
<rect x="1130" y="480" width="120" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1190.0" y="494.9">all_drain_done</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="698.0" y="538.5">Fires one cycle after the LAST input arrives. Router-side drain aggregation is retired:</tspan><tspan x="698.0" y="551.0">subtree drain now rides the DATA path (DCB det out_finish).</tspan></text>
