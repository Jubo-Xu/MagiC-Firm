<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">BoardControl — per-board control / attempt state machine (BoardControl.sv)</tspan><tspan x="38.0" y="49.2">two independent axes: EVENT_MODE {ORIGINATE, FORWARD} × DATA_SRC {EXTERNAL, INTERNAL}; a 1-bit attempt tag makes stale data drop-only (no purge window)</tspan></text>
<rect x="220" y="70" width="1100" height="760" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="228.0" y="86.3" font-weight="bold">BoardControl  #(EVENT_MODE, DATA_SRC, M, PAYLOAD_W)</tspan></text>
<rect x="20" y="110" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="125.3">ev_valid / ev_type / ev_payload /</tspan><tspan x="110.0" y="136.6">ev_attempt   (parent | host start/finish)</tspan></text>
<rect x="20" y="250" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="265.3">post_select [M] /</tspan><tspan x="110.0" y="276.6">post_select_attempt [M]</tspan></text>
<rect x="20" y="420" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="434.9">in_valid, data_attempt</tspan></text>
<rect x="20" y="560" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="574.9">drain_done  (DCB det finish)</tspan></text>
<rect x="20" y="620" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="634.9">data_valid_output</tspan></text>
<rect x="250" y="100" width="260" height="70" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="380.0" y="119.5">event decode</tspan><tspan x="380.0" y="132.0">is_start  = valid &amp; type==START (00)</tspan><tspan x="380.0" y="144.5">is_abort_ev = valid &amp; type==ABORT (01)</tspan><tspan x="380.0" y="157.0">is_finish = valid &amp; type==FINISH (10)</tspan></text>
<rect x="250" y="220" width="300" height="100" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="400.0" y="248.2">abort detect (ORIGINATE only)</tspan><tspan x="400.0" y="260.8">abort_detected = |( post_select &amp;</tspan><tspan x="400.0" y="273.2">   (post_select_attempt XNOR {M{attempt}}) )</tspan><tspan x="400.0" y="285.8">abort_det_q ← abort_detected &amp; ~abort_det_q  (one-shot)</tspan><tspan x="400.0" y="298.2">abort_now = abort_det_q | is_abort_ev</tspan></text>
<rect x="620" y="100" width="660" height="300" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="628.0" y="114.5" font-weight="bold">FSM (all boards)</tspan></text>
<ellipse cx="715.0" cy="235.0" rx="55.0" ry="25.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="715.0" y="238.6" font-weight="bold">IDLE</tspan></text>
<ellipse cx="945.0" cy="235.0" rx="55.0" ry="25.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="945.0" y="238.6" font-weight="bold">EXEC</tspan></text>
<ellipse cx="1175.0" cy="235.0" rx="55.0" ry="25.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="1175.0" y="238.6" font-weight="bold">DRAIN</tspan></text>
<rect x="620" y="430" width="300" height="70" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="770.0" y="455.8">attempt register (1 bit)</tspan><tspan x="770.0" y="468.2">START → 0 · abort flips (ORIGINATE) /</tspan><tspan x="770.0" y="480.8">adopts ev_attempt (FORWARD) · FINISH → 0</tspan></text>
<rect x="620" y="530" width="420" height="130" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="830.0" y="560.8">combinational outputs</tspan><tspan x="830.0" y="573.2">reset = rst | abort_now | rst_for_finish      (LOCAL, never propagated)</tspan><tspan x="830.0" y="585.8">data_att_eff = INTERNAL ? attempt : data_attempt</tspan><tspan x="830.0" y="598.2">set_in_data_to_zero = in_valid &amp; ((data_att_eff != attempt) | abort_now)</tspan><tspan x="830.0" y="610.8">out_attempt = data_valid_output ? attempt : 0</tspan><tspan x="830.0" y="623.2">cur_attempt = attempt   (stamps the post-select fast path)</tspan><tspan x="830.0" y="635.8">discard = abort_now      (root → host: reset decoder / gap estimator)</tspan></text>
<rect x="1070" y="430" width="230" height="90" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1185.0" y="459.5">out_ev register (+1 cycle)</tspan><tspan x="1185.0" y="472.0">default = FORWARD relay of ev_*</tspan><tspan x="1185.0" y="484.5">ORIGINATE overrides: START (att 0),</tspan><tspan x="1185.0" y="497.0">ABORT (~attempt), FINISH (attempt)</tspan></text>
<rect x="250" y="360" width="300" height="80" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Courier New, monospace" font-size="10" fill="#111111" text-anchor="start"><tspan x="258.0" y="373.5" font-weight="bold">board             EVENT_MODE  DATA_SRC</tspan><tspan x="258.0" y="386.0">distributed root  ORIGINATE   EXTERNAL</tspan><tspan x="258.0" y="398.5">distributed mid   FORWARD     EXTERNAL</tspan><tspan x="258.0" y="411.0">distributed leaf  FORWARD     INTERNAL</tspan><tspan x="258.0" y="423.5">monolithic        ORIGINATE   INTERNAL</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="258.0" y="703.5">A parent always changes attempt one cycle before its children can, so incoming data whose attempt tag</tspan><tspan x="258.0" y="716.0">mismatches is simply stale and is dropped (set_in_data_to_zero) — no flush / purge window is needed.</tspan><tspan x="258.0" y="728.5">The board-generated abort is registered (abort_det_q) to break the reset → clears-post_select → abort loop.</tspan></text>
