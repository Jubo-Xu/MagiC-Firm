<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1425.0" y="594.9">set_in_data_to_zero</tspan></text>
<rect x="1350" y="620" width="150" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1425.0" y="634.9">out_attempt / cur_attempt</tspan></text>
<rect x="1350" y="660" width="150" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1425.0" y="674.9">discard</tspan></text>
<rect x="1350" y="450" width="150" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1425.0" y="465.3">out_ev_valid / type /</tspan><tspan x="1425.0" y="476.6">payload / attempt</tspan></text>
