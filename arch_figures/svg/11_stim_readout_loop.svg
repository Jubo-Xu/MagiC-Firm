<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="190.0" y="279.8" font-weight="bold">PhysicalMMIO  (P = 1)</tspan><tspan x="190.0" y="293.6">out_data = ROUND INDEX</tspan><tspan x="190.0" y="307.3">(sim CW type: entry = its index)</tspan></text>
<rect x="90" y="370" width="260" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="220.0" y="401.7" font-weight="bold">DetectorConstructBlock</tspan><tspan x="220.0" y="415.4">in_meas / in_valid / in_meas_finish</tspan></text>
<rect x="300" y="115" width="160" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="380.0" y="135.9">fwd_det / fwd_raw … → parent</tspan></text>
<rect x="600" y="90" width="760" height="420" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="608.0" y="106.3" font-weight="bold">StimReadout  #(M, SHOTS, DEPTH, MEAS_FILE, VALID_FILE)  — GLOBAL rst + cw_gen_finish, never board_reset</tspan></text>
<rect x="630" y="140" width="300" height="120" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="780.0" y="172.0">shot_q / base_q registers</tspan><tspan x="780.0" y="184.5">reset | cw_gen_finish : shot ← 0, base ← 0</tspan><tspan x="780.0" y="197.0">EV_ABORT (guarded shot+1 &lt; SHOTS):</tspan><tspan x="780.0" y="209.5">   shot ← shot+1, base ← (shot+1) × DEPTH</tspan><tspan x="780.0" y="222.0">(pointer moves in LOCKSTEP across all leaves —</tspan><tspan x="780.0" y="234.5"> the abort is global and in sync)</tspan></text>
<rect x="960" y="150" width="260" height="60" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1090.0" y="170.8">addr = base_q + mmio_out_data</tspan><tspan x="1090.0" y="183.2">rom_addr = active ? addr : 0</tspan><tspan x="1090.0" y="195.8">active = mmio_out_valid &amp; ~rst</tspan></text>
<rect x="960" y="250" width="180" height="60" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1050.0" y="270.8" font-weight="bold">SyncROM  meas  (BRAM)</tspan><tspan x="1050.0" y="283.2">SHOTS × DEPTH rows × M bits</tspan><tspan x="1050.0" y="295.8">shot-major · sim_readout_meas.mem</tspan></text>
<rect x="1160" y="250" width="180" height="60" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1250.0" y="270.8" font-weight="bold">SyncROM  valid  (BRAM)</tspan><tspan x="1250.0" y="283.2">same layout</tspan><tspan x="1250.0" y="295.8">sim_readout_valid.mem</tspan></text>
<rect x="630" y="300" width="300" height="60" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="780.0" y="320.8">finish_q ← mmio_out_valid &amp; cw_gen_finish</tspan><tspan x="780.0" y="333.2">(aligned with the 1-cycle BRAM read)</tspan><tspan x="780.0" y="345.8">out_meas_finish = finish_q ? valid_data : 0</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="68.0" y="553.5">The ABORT that advances the readout is the SAME event that restarts the CW program in BoardControl / PhysicalMMIO, so a rejected shot is</tspan><tspan x="68.0" y="566.0">discarded everywhere on the same cycle. Multi-shot / multi-trial tests (test_control_board_stim, tb_ControlBoard) drive only the root's start / finish / gap_post_select.</tspan></text>
