<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">StimReadout — synthesizable measurement-readout stand-in for hardware-in-the-loop stim tests (StimReadout.sv)</tspan><tspan x="38.0" y="49.2">replays RECORDED measurements from BRAM back into a leaf ControlBoard; closes the mmio_out → readout → in_meas loop</tspan></text>
<rect x="60" y="90" width="420" height="420" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="68.0" y="106.3" font-weight="bold">Leaf ControlBoard  (FORWARD · INTERNAL)</tspan></text>
