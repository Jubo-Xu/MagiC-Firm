<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">MeasurementSync (M raw lines) / OutputSync (D detector lines) — identical logic (MeasurementSync.sv, OutputSync.sv)</tspan><tspan x="38.0" y="49.2">asynchronously arriving per-line values are re-aligned into one word per meas-time / det-time, driven by a compiled mask program</tspan></text>
<rect x="220" y="70" width="1060" height="640" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="228.0" y="86.3" font-weight="bold">MeasurementSync  #(M, D_FIFO, PC_W, SAT_PC)</tspan></text>
<rect x="20" y="130" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="145.3">sync_mask [M]</tspan><tspan x="110.0" y="156.6">(regfile word @ pc)</tspan></text>
<rect x="20" y="300" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="315.3">in_meas[i] / in_valid[i] / in_finish[i]</tspan><tspan x="110.0" y="326.6">(one per line, arrive in any cycle)</tspan></text>
<rect x="250" y="110" width="260" height="70" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="380.0" y="135.8" font-weight="bold">sync regfile  (RegFileROM, in the parent DCB)</tspan><tspan x="380.0" y="148.2">row pc → mask: which lines this</tspan><tspan x="380.0" y="160.8">meas-time needs</tspan></text>
<rect x="560" y="110" width="260" height="70" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="690.0" y="135.8">pc register</tspan><tspan x="690.0" y="148.2">if ready: pc ← (SAT_EN &amp;&amp; pc+1 &gt; SAT_PC)</tspan><tspan x="690.0" y="160.8">                  ? SAT_PC : pc + 1</tspan></text>
<rect x="250" y="220" width="720" height="240" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="258.0" y="234.4" font-weight="bold">line i  (replicated M times)</tspan></text>
<rect x="270" y="270" width="230" height="90" rx="0.0" fill="#E3F0FB" stroke="#1F5FA8" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="385.0" y="299.5" font-weight="bold">FIFO_i  (D_FIFO × {value, finish})</tspan><tspan x="385.0" y="312.0">head / tail / count</tspan><tspan x="385.0" y="324.5">push: in_valid[i] &amp; ~bypass</tspan><tspan x="385.0" y="337.0">pop:  ready &amp; from_fifo[i]</tspan></text>
<rect x="540" y="260" width="260" height="90" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="670.0" y="289.5">source mux</tspan><tspan x="670.0" y="302.0">from_fifo[i] = mask[i] &amp; ~empty[i]</tspan><tspan x="670.0" y="314.5">bypass_sel[i] = mask[i] &amp; empty[i] &amp; in_valid[i]</tspan><tspan x="670.0" y="327.0">value = from_fifo ? head : in_meas[i]</tspan></text>
<rect x="540" y="375" width="260" height="50" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="670.0" y="397.0">avail[i] = ~mask[i] | from_fifo[i]</tspan><tspan x="670.0" y="409.5">               | bypass_sel[i]</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="278.0" y="403.5">overflow check (sim): want_push &amp; full</tspan></text>
<rect x="250" y="480" width="720" height="30" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="258.0" y="494.4" font-weight="bold">line i+1 …</tspan></text>
<rect x="250" y="525" width="720" height="30" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="258.0" y="539.5" font-weight="bold">line M−1</tspan></text>
<rect x="1000" y="300" width="260" height="70" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1130.0" y="325.8">ready = AND over all lines of avail[i]</tspan><tspan x="1130.0" y="338.2">(all-zero mask ⇒ trivially ready:</tspan><tspan x="1130.0" y="350.8">emit all-0 and advance = fast-forward)</tspan></text>
<rect x="1000" y="400" width="260" height="110" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1130.0" y="427.0">output register (1 pulse per accepted step)</tspan><tspan x="1130.0" y="439.5">out_meas[i] ← mask[i] ? value_i : 0</tspan><tspan x="1130.0" y="452.0">out_used ← mask</tspan><tspan x="1130.0" y="464.5">out_valid ← ready</tspan><tspan x="1130.0" y="477.0">out_finish ← OR over used lines of</tspan><tspan x="1130.0" y="489.5">   (from_fifo ? head_finish : in_finish[i])</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="258.0" y="613.5">Invariant used by the compiler: a meas-time with an all-0 sync mask has all-0 core words, so one shared pc clocks both</tspan><tspan x="258.0" y="626.0">MeasurementSync and every Kernel; with copy-last the appended wait row saturates the pc so the last round repeats.</tspan></text>
