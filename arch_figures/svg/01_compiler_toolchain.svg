<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">Compiler toolchain (hardware/compiler/control_system)</tspan><tspan x="38.0" y="49.2">stim circuit + hardware config → per-board regfiles / MMIO programs / simulation vectors; validated against stim</tspan></text>
<rect x="30" y="90" width="200" height="50" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="130.0" y="111.7" font-weight="bold">stim circuit (.stim)</tspan><tspan x="130.0" y="125.5">QEC / magic-state cultivation</tspan></text>
<rect x="30" y="170" width="200" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="130.0" y="194.8" font-weight="bold">hardware config (.json)</tspan><tspan x="130.0" y="208.6">layers · boards · kernels {n,h} · raw_out</tspan><tspan x="130.0" y="222.3">+ postselect detector set</tspan></text>
<rect x="290" y="80" width="260" height="80" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="420.0" y="103.0" font-weight="bold">parser.py — DetectorConstructionScanner</tspan><tspan x="420.0" y="116.7">scan() → refine()</tspan><tspan x="420.0" y="130.4">det_idx = stim detector index</tspan><tspan x="420.0" y="144.2">channels = spatial coords, windows, stages</tspan></text>
<rect x="290" y="180" width="260" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="420.0" y="204.8" font-weight="bold">config.py — CompilerConfig</tspan><tspan x="420.0" y="218.6">board tree, path_to_root, lca</tspan><tspan x="420.0" y="232.3">postselect set (explicit indices)</tspan></text>
<rect x="610" y="120" width="260" height="80" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="740.0" y="149.8" font-weight="bold">placement.py — Placement</tspan><tspan x="740.0" y="163.6">channel → LCA of its support (Option B)</tspan><tspan x="740.0" y="177.3">forwarding (normal + obs), stage boards</tspan></text>
<rect x="930" y="120" width="260" height="90" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="1060.0" y="147.9" font-weight="bold">compiler.py — Compiler (pure library)</tspan><tspan x="1060.0" y="161.7">mask generation → BoardProgram,</tspan><tspan x="1060.0" y="175.4">KernelProgram, DetectorOutput</tspan><tspan x="1060.0" y="189.2">core index = emission rank mod h</tspan></text>
<rect x="930" y="260" width="360" height="110" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1110.0" y="293.2" font-weight="bold">serializer.py — Serializer  (PHYSICAL-port layout)</tspan><tspan x="1110.0" y="305.8">board&lt;i&gt;/{json,mem}: qubit_scope (leaf), sync, k&lt;i&gt;_selector,</tspan><tspan x="1110.0" y="318.2">k&lt;i&gt;_core, raw_selector[_obs], output_sync, global_index,</tspan><tspan x="1110.0" y="330.8">round_marker, postselect (stage) · connections.json</tspan><tspan x="1110.0" y="343.2">measurement_map.json · manifest.json · report.txt</tspan></text>
<rect x="930" y="400" width="360" height="70" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1110.0" y="425.8" font-weight="bold">gen_instr_cw.py  (Phase B)</tspan><tspan x="1110.0" y="438.2">MMIO_instr_&lt;p&gt;.mem / MMIO_cw_&lt;p&gt;.mem per core</tspan><tspan x="1110.0" y="450.8">wt = inter-measurement time / clock period</tspan></text>
<rect x="930" y="500" width="360" height="80" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1110.0" y="524.5" font-weight="bold">gen_sim.py  (Phase C)</tspan><tspan x="1110.0" y="537.0">stim samples → in_meas / in_valid (DCB layout),</tspan><tspan x="1110.0" y="549.5">sim_readout_meas / valid (StimReadout layout),</tspan><tspan x="1110.0" y="562.0">expected_dets, expected_postselect</tspan></text>
<rect x="610" y="260" width="260" height="80" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="740.0" y="284.5" font-weight="bold">cli.py — front door</tspan><tspan x="740.0" y="297.0">orchestrates stages 1–3 (drives Compiler + Serializer)</tspan><tspan x="740.0" y="309.5">--wait-rounds · --wait-row copy-last</tspan><tspan x="740.0" y="322.0">--postselect-layout · --output-sync</tspan></text>
<rect x="610" y="400" width="260" height="80" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="740.0" y="424.5" font-weight="bold">Validation vs stim</tspan><tspan x="740.0" y="437.0">test_harness.py: in-memory compiler</tspan><tspan x="740.0" y="449.5">validate_serialized.py: round-trip from files</tspan><tspan x="740.0" y="462.0">10 topologies × 2 circuits, 0 mismatches</tspan></text>
<rect x="290" y="650" width="260" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="420.0" y="674.8" font-weight="bold">SystemC emulator</tspan><tspan x="420.0" y="688.6">hardware/emulator — load_mem_file()</tspan><tspan x="420.0" y="702.3">cycle-accurate model of every block</tspan></text>
<rect x="610" y="650" width="260" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="740.0" y="674.8" font-weight="bold">RTL testbenches</tspan><tspan x="740.0" y="688.6">hardware/rtl — gen_dcb_tb.py, gen_cb_tb.py</tspan><tspan x="740.0" y="702.3">Verilator (vsim.sh) / Vivado XSim</tspan></text>
<rect x="930" y="650" width="260" height="70" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="1060.0" y="674.8" font-weight="bold">FPGA synthesis (Vivado)</tspan><tspan x="1060.0" y="688.6">$readmemb → LUTRAM (RegFileROM)</tspan><tspan x="1060.0" y="702.3">/ BRAM (SyncROM) INIT strings</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="298.0" y="573.5">The SAME .mem files (one word per line, LSB = bit 0) feed the SystemC model, the RTL simulation and synthesis —</tspan><tspan x="298.0" y="586.0">so a program validated in the emulator is bit-identical on the FPGA.</tspan></text>
