<marker id="ah-plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#444444"/></marker>
<marker id="ah-fsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E7D32"/></marker>
</defs>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">Memory primitives (rtl/src/lib, emulator/include/lib) — every compiled program is a .mem file loaded by $readmemb / $readmemh</tspan><tspan x="38.0" y="49.2">file format: one word per line, MSB-first, LSB = bit 0 — parsed identically by the SystemC load_mem_file() and by the RTL, baked into LUTRAM / BRAM INIT strings at synthesis</tspan></text>
<rect x="30" y="80" width="620" height="200" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="96.3" font-weight="bold">RegFileROM  #(DEPTH, WIDTH, INIT_FILE, RAM_STYLE)  — async read → LUTRAM / distributed RAM</tspan></text>
<rect x="50" y="150" width="150" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="125.0" y="164.9">addr [⌈log2 DEPTH⌉]</tspan></text>
<rect x="220" y="130" width="290" height="60" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="365.0" y="157.0" font-weight="bold">mem [DEPTH] × WIDTH</tspan><tspan x="365.0" y="169.5">data = mem[addr]  (combinational, no clock, no enable)</tspan></text>
<rect x="530" y="143" width="110" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="585.0" y="158.3">data [WIDTH]</tspan><tspan x="585.0" y="169.6">(same cycle)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="58.0" y="223.5">Used for the small compiler regfiles read at a registered pc and consumed in the SAME cycle:</tspan><tspan x="58.0" y="236.0">sync masks, kernel cores, output_sync, global_index, round_marker, postselect, MMIO instruction regfile.</tspan></text>
<rect x="690" y="80" width="640" height="200" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="698.0" y="96.3" font-weight="bold">SyncROM  #(DEPTH, WIDTH, INIT_FILE, RAM_STYLE)  — sync read, 1-cycle latency → block RAM</tspan></text>
<rect x="710" y="150" width="110" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="765.0" y="164.9">en, addr</tspan></text>
<rect x="840" y="120" width="300" height="70" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="990.0" y="145.8" font-weight="bold">BRAM read stage (pure, holds when !en)</tspan><tspan x="990.0" y="158.2">if (en) mem_q ← mem[addr];  vld_q ← en</tspan><tspan x="990.0" y="170.8">NO reset (models the BRAM output register)</tspan></text>
<rect x="840" y="200" width="160" height="40" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="920.0" y="217.0">fabric mux</tspan><tspan x="920.0" y="229.5">data = vld_q ? mem_q : 0</tspan></text>
<rect x="1180" y="150" width="130" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1245.0" y="165.3">data [WIDTH],</tspan><tspan x="1245.0" y="176.6">data_valid  (+1 cycle)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="1018.0" y="248.5">Used for large memories: the MMIO command-word memory</tspan><tspan x="1018.0" y="261.0">and StimReadout's recorded measurements.</tspan></text>
<rect x="30" y="320" width="1300" height="300" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="336.4" font-weight="bold">BankedRAM  #(BANKS, DEPTH, WIDTH, RAM_STYLE)  — banked simple-dual-port RAM, synchronous read, READ_FIRST  (the PGE's M_T column store)</tspan></text>
<rect x="50" y="380" width="330" height="90" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="215.0" y="409.5">index → bank = index[log2 BANKS−1:0]</tspan><tspan x="215.0" y="422.0">            offset = index[INDEX_W−1 : log2 BANKS]</tspan><tspan x="215.0" y="434.5">(decode done by the CALLER: the compiler's relabelling</tspan><tspan x="215.0" y="447.0"> π(c) = offset·BANKS + bank makes the split fixed wiring)</tspan></text>
<rect x="420" y="370" width="200" height="110" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="520.0" y="403.2" font-weight="bold">bank 0</tspan><tspan x="520.0" y="415.8">mem [DEPTH] × WIDTH</tspan><tspan x="520.0" y="428.2">rd_en / rd_addr → rd_data (+1 cycle;</tspan><tspan x="520.0" y="440.8">0 when rd_en was low)</tspan><tspan x="520.0" y="453.2">wr_en / wr_addr / wr_data</tspan></text>
<rect x="640" y="370" width="200" height="110" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="740.0" y="403.2" font-weight="bold">bank 1</tspan><tspan x="740.0" y="415.8">mem [DEPTH] × WIDTH</tspan><tspan x="740.0" y="428.2">rd_en / rd_addr → rd_data (+1 cycle;</tspan><tspan x="740.0" y="440.8">0 when rd_en was low)</tspan><tspan x="740.0" y="453.2">wr_en / wr_addr / wr_data</tspan></text>
<rect x="860" y="370" width="200" height="110" rx="0.0" fill="#FFF4D6" stroke="#B07D00" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="960.0" y="403.2" font-weight="bold">bank BANKS−1</tspan><tspan x="960.0" y="415.8">mem [DEPTH] × WIDTH</tspan><tspan x="960.0" y="428.2">rd_en / rd_addr → rd_data (+1 cycle;</tspan><tspan x="960.0" y="440.8">0 when rd_en was low)</tspan><tspan x="960.0" y="453.2">wr_en / wr_addr / wr_data</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="853.0" y="428.5">…</tspan></text>
<rect x="1090" y="380" width="220" height="70" rx="35.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="1200.0" y="406.7">rd_data [BANKS × WIDTH]</tspan><tspan x="1200.0" y="417.9">→ consumer XOR tree takes all banks</tspan><tspan x="1200.0" y="429.2">unconditionally (rd_en is the mask)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="58.0" y="513.5">Banking rule (enforced by the PGE compiler): for every fault at most one of its checks lands in any one bank, so all of a fault's columns</tspan><tspan x="58.0" y="526.0">are readable in a single cycle. One read + one write port per bank. Async reset zeroes every bank (note: prevents BRAM inference — revisit for a real target).</tspan></text>
