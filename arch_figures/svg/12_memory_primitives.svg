<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8A6D00" text-anchor="middle"><tspan x="400.0" y="427.5">per-bank offset</tspan></text>
<polyline points="620.0,425.0 630.0,425.0 640.0,425.0" fill="none" stroke="#8A6D00" stroke-width="1.3"/>
<polyline points="1060.0,425.0 1075.0,425.0 1075.0,415.0 1090.0,415.0" fill="none" stroke="#8A6D00" stroke-width="1.3" marker-end="url(#ah-mem)"/>
