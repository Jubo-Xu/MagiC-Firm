<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="840" viewBox="0 0 1330 840">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="ah-data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F3A93"/></marker>
<marker id="ah-bus" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F3A93"/></marker>
<marker id="ah-ctrl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#C62828"/></marker>
<marker id="ah-ps" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#E65100"/></marker>
<marker id="ah-mem" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A6D00"/></marker>
<marker id="ah-rst" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#6A1B9A"/></marker>
<marker id="ah-plain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#444444"/></marker>
<marker id="ah-fsm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E7D32"/></marker>
</defs>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">PhysicalMMIO state machines — InstrSequencer.sv (instruction pointer + event FSM) and InstrDecode.sv (one instruction → CW read stream)</tspan></text>
<rect x="30" y="70" width="1260" height="370" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="86.3" font-weight="bold">InstrSequencer  (all state registered; outputs: instr_en = en_q, instr_addr = en_q ? ptr : 0, rst_out = rst | is_abort | rst_fin, cw_gen_finish = rst_fin)</tspan></text>
<ellipse cx="145.0" cy="230.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="145.0" y="226.7" font-weight="bold">IDLE</tspan><tspan x="145.0" y="240.4">ptr = 0, en = 0</tspan></text>
<ellipse cx="625.0" cy="230.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="625.0" y="226.7" font-weight="bold">EXEC</tspan><tspan x="625.0" y="240.4">fetch / run</tspan></text>
<ellipse cx="1115.0" cy="230.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="1115.0" y="226.7" font-weight="bold">DRAIN</tspan><tspan x="1115.0" y="240.4">no new fetch</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="88.0" y="418.5">WAIT behaviour: ptr saturates at DEPTH−1, so the last (compiled 'wait' = one syndrome-extraction round) instruction repeats until FINISH.</tspan></text>
<rect x="30" y="470" width="1260" height="330" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="38.0" y="486.4" font-weight="bold">InstrDecode  (Mealy: r_en / r_addr / one_instr_end combinational so CW reads stay contiguous: end_i at T, start_{i+1} at T+1; state registered, async rst = rst_out)</tspan></text>
<ellipse cx="145.0" cy="630.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="145.0" y="633.6" font-weight="bold">IDLE</tspan></text>
<ellipse cx="625.0" cy="630.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="625.0" y="626.7" font-weight="bold">WAITC</tspan><tspan x="625.0" y="640.5">wcnt idle cycles</tspan></text>
<ellipse cx="1115.0" cy="630.0" rx="65.0" ry="30.0" fill="#E6F4EA" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="1115.0" y="626.7" font-weight="bold">STREAM</tspan><tspan x="1115.0" y="640.5">r_addr walks</tspan></text>
<path d="M210.0,230.0 Q385.0,185.0 472.5,207.5 L560.0,230.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="294.6" y="171.0" width="180.8" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="385.0" y="181.5">is_start: ptr ← 0, en ← 1</tspan><tspan x="385.0" y="194.0">(fetch instruction 0 next cycle)</tspan></text>
<path d="M592.5,200.0 Q575.0,120.0 625.0,120.0 Q675.0,120.0 666.2,160.0 L657.5,200.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="372.6" y="106.0" width="504.8" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="625.0" y="116.5">one_instr_end: ptr ← min(ptr+1, DEPTH−1), en ← 1   (no-stall: next instr fetched next cycle)</tspan><tspan x="625.0" y="129.0">else: en ← 0, ptr holds</tspan></text>
<path d="M592.5,260.0 Q575.0,365.0 625.0,365.0 Q675.0,365.0 666.2,312.5 L657.5,260.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="486.0" y="351.0" width="278.0" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="625.0" y="361.5">is_abort: ptr ← 0, en ← 1, rst_out high THIS cycle</tspan><tspan x="625.0" y="374.0">(InstrDecode cleared before the refetch)</tspan></text>
<path d="M690.0,230.0 Q870.0,185.0 960.0,207.5 L1050.0,230.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="763.4" y="171.0" width="213.2" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="870.0" y="181.5">is_finish &amp; ~one_instr_end:</tspan><tspan x="870.0" y="194.0">instruction mid-flight → let it finish</tspan></text>
<path d="M1115.0,260.0 Q1115.0,300.0 630.0,300.0 Q145.0,300.0 145.0,280.0 L145.0,260.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="488.3" y="292.0" width="283.4" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="630.0" y="302.5">one_instr_end: rst_fin ← 1  (= cw_gen_finish pulse)</tspan></text>
<path d="M625.0,260.0 Q625.0,290.0 407.5,290.0 Q190.0,290.0 190.2,275.0 L190.5,260.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="265.8" y="282.0" width="283.4" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="407.5" y="292.5">is_finish &amp; one_instr_end (same cycle): rst_fin ← 1</tspan></text>
<path d="M210.0,630.0 Q385.0,585.0 472.5,607.5 L560.0,630.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="302.7" y="571.0" width="164.6" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="385.0" y="581.5">en &amp; wt ≠ 0: latch start/end,</tspan><tspan x="385.0" y="594.0">wcnt ← wt − 1</tspan></text>
<path d="M145.0,600.0 Q145.0,520.0 630.0,520.0 Q1115.0,520.0 1115.0,560.0 L1115.0,600.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="372.2" y="512.0" width="515.6" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="630.0" y="522.5">en &amp; wt == 0 &amp; start ≠ end:  r_en = 1, r_addr = start THIS cycle (fast path); addr ← start + 1</tspan></text>
<path d="M112.5,660.0 Q95.0,740.0 145.0,740.0 Q195.0,740.0 186.2,700.0 L177.5,660.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="60.0" y="726.0" width="170.0" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="145.0" y="736.5">en &amp; wt == 0 &amp; start == end:</tspan><tspan x="145.0" y="749.0">single read, one_instr_end = 1</tspan></text>
<path d="M592.5,660.0 Q575.0,740.0 625.0,740.0 Q675.0,740.0 666.2,700.0 L657.5,660.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="553.5" y="732.0" width="143.0" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="625.0" y="742.5">wcnt ≠ 0: wcnt ← wcnt − 1</tspan></text>
<path d="M690.0,630.0 Q870.0,585.0 960.0,607.5 L1050.0,630.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="749.9" y="571.0" width="240.2" height="28.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="870.0" y="581.5">wcnt == 0: r_en = 1, r_addr = start;</tspan><tspan x="870.0" y="594.0">addr ← start + 1  (or IDLE if start == end)</tspan></text>
<path d="M1082.5,660.0 Q1065.0,740.0 1115.0,740.0 Q1165.0,740.0 1156.2,700.0 L1147.5,660.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="970.6" y="732.0" width="288.8" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="1115.0" y="742.5">addr ≠ end: r_en = 1, r_addr = addr, addr ← addr + 1</tspan></text>
<path d="M1115.0,660.0 Q1115.0,780.0 630.0,780.0 Q145.0,780.0 145.0,720.0 L145.0,660.0" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#ah-fsm)"/>
<rect x="356.0" y="772.0" width="548.0" height="16.0" fill="#FFFFFF" fill-opacity="0.92"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle"><tspan x="630.0" y="782.5">addr == end: r_en = 1, r_addr = end, one_instr_end = 1  (→ sequencer registers the next instruction)</tspan></text>
</svg>