<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111111" text-anchor="start"><tspan x="38.0" y="29.2" font-weight="bold">Kernel — one detector-construction channel (Kernel.sv)</tspan><tspan x="38.0" y="49.2">selector picks N of the M synced lines; H cores XOR-accumulate masked subsets and emit-and-clear when a detector window completes</tspan></text>
<rect x="220" y="70" width="1060" height="780" rx="12.0" fill="#FAFAFA" stroke="#7A7A7A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111" text-anchor="start"><tspan x="228.0" y="86.3" font-weight="bold">Kernel  #(N, H, M, PC_W, SAT_PC)   — 1-cycle latency: datapath combinational, acc / pc / outputs registered</tspan></text>
<rect x="20" y="130" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="144.9">in_valid  (MeasurementSync.out_valid)</tspan></text>
<rect x="20" y="170" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="184.9">in_used [M]</tspan></text>
<rect x="20" y="210" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="224.9">in_meas [M]</tspan></text>
<rect x="20" y="250" width="180" height="24" rx="12.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="264.9">in_finish</tspan></text>
<rect x="20" y="300" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="315.3">selector_indexes [N × ⌈log2 M⌉]</tspan><tspan x="110.0" y="326.6">(static, k&lt;i&gt;_selector.mem)</tspan></text>
<rect x="20" y="360" width="180" height="36" rx="18.0" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111111" text-anchor="middle"><tspan x="110.0" y="375.3">core_mask [H(N+1)]</tspan><tspan x="110.0" y="386.6">(k&lt;i&gt;_core.mem @ core_regfile_pc)</tspan></text>
<rect x="260" y="130" width="230" height="90" rx="12.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="middle"><tspan x="375.0" y="157.9" font-weight="bold">Selector</tspan><tspan x="375.0" y="171.7">N index muxes over the M lines</tspan><tspan x="375.0" y="185.4">b_m[j] = in_valid &amp; in_used[idx_j]</tspan><tspan x="375.0" y="199.2">            &amp; in_meas[idx_j]</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="568.0" y="653.5">core_mask word layout (LSB = bit 0):</tspan></text>
<rect x="560" y="665" width="90" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="605.0" y="683.2">core H−1</tspan></text>
<rect x="650" y="665" width="50" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="675.0" y="683.2">…</tspan></text>
<rect x="700" y="665" width="90" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="745.0" y="683.2">core 1</tspan></text>
<rect x="790" y="665" width="90" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="835.0" y="683.2">core 0</tspan></text>
<rect x="560" y="710" width="60" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="590.0" y="728.2">emit</tspan></text>
<rect x="620" y="710" width="260" height="30" rx="0.0" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="750.0" y="728.2">sel[N−1 … 0]  (which of the N selected bits)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="568.0" y="758.5">core c occupies bits [c(N+1) +: N+1]:  bit N = emit, bits N−1..0 = select mask</tspan></text>
<rect x="560" y="120" width="420" height="200" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="568.0" y="134.4" font-weight="bold">Core 0</tspan></text>
<rect x="580" y="170" width="90" height="50" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="625.0" y="192.0">AND</tspan><tspan x="625.0" y="204.5">sel_0 &amp; b_m</tspan></text>
<rect x="690" y="170" width="110" height="50" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="745.0" y="192.0">XOR tree</tspan><tspan x="745.0" y="204.5">res = ^(sel_0 &amp; b_m)</tspan></text>
<rect x="820" y="170" width="100" height="50" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="870.0" y="192.0">XOR</tspan><tspan x="870.0" y="204.5">b_core = res ^ acc</tspan></text>
<rect x="700" y="250" width="130" height="40" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="765.0" y="267.0">acc[0]  (1 bit)</tspan><tspan x="765.0" y="279.5">← emit ? 0 : b_core</tspan></text>
<rect x="560" y="340" width="420" height="40" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="568.0" y="354.4" font-weight="bold">Core 1  (same datapath)</tspan></text>
<rect x="560" y="400" width="420" height="40" rx="12.0" fill="#F1F1F1" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="6,4"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111111" text-anchor="start"><tspan x="568.0" y="414.4" font-weight="bold">Core H−1  (same datapath)</tspan></text>
<rect x="1010" y="180" width="240" height="100" rx="12.0" fill="#F0EAFA" stroke="#5E35B1" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1130.0" y="208.2">One-hot select</tspan><tspan x="1130.0" y="220.8">out_det = OR_c ( emit_c &amp; b_core_c )</tspan><tspan x="1130.0" y="233.2">any_emit = in_valid &amp; |emit</tspan><tspan x="1130.0" y="245.8">(≤ 1 core emits per meas-time —</tspan><tspan x="1130.0" y="258.2">compiler guarantee)</tspan></text>
<rect x="1010" y="340" width="240" height="80" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="1130.0" y="364.5">Output registers</tspan><tspan x="1130.0" y="377.0">out_valid ← any_emit</tspan><tspan x="1130.0" y="389.5">out_det ← out_det_c</tspan><tspan x="1130.0" y="402.0">out_finish ← any_emit ? in_finish : 0</tspan></text>
<rect x="260" y="560" width="260" height="80" rx="0.0" fill="#EDEDED" stroke="#1A1A1A" stroke-width="1"/>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="middle"><tspan x="390.0" y="584.5">core_regfile_pc counter</tspan><tspan x="390.0" y="597.0">+1 per in_valid (in lockstep with</tspan><tspan x="390.0" y="609.5">MeasurementSync); saturates at</tspan><tspan x="390.0" y="622.0">SAT_PC (copy-last wait row)</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111111" text-anchor="start"><tspan x="268.0" y="803.5">Why this shape: a detector = XOR of measurements spread over several meas-times. Each core accumulates one</tspan><tspan x="268.0" y="816.0">detector window; the compiler assigns core index = emission rank mod H so windows sharing a core never overlap.</tspan></text>
